name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: labops_test
          POSTGRES_PASSWORD: labops_test
          POSTGRES_DB: labops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labops_test -d labops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://labops_test:labops_test@127.0.0.1:5432/labops_test
      NODE_ENV: test
      OIDC_ISSUER_URL: https://issuer.example
      OIDC_CLIENT_ID: labops-test
      OIDC_CLIENT_SECRET: test-only-placeholder
      PUBLIC_BASE_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db run migrate
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
        env:
          PORT: 5000
          BASE_PATH: /

  # Security scanning runs on the PR to block regressions from entering main.
  # Trivy is the only tool that needs to run on every PR.
  # Dependency audit, gitleaks, and CodeQL run on schedule + push to main
  # to avoid slowing down every PR.
  trivy:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          ignore-unpatched: true
          output: trivy-results.sarif
          format: sarif
      - uses: github/codeql-action/upload-sarif@d6bbdef45e766d081b84a2def353b0055f728d3e # v3.29.3
        if: always()
        with:
          sarif_file: trivy-results.sarif
  dependency-review:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@4901385134134e04cec5fbe5ddfe3b2c5bd5d976 # v4
        with:
          fail-on-severity: "critical"
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, PostgreSQL, Unicode-DFS-2016
