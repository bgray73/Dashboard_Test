name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: labops_test
          POSTGRES_PASSWORD: labops_test
          POSTGRES_DB: labops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labops_test -d labops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://labops_test:labops_test@127.0.0.1:5432/labops_test
      NODE_ENV: test
      OIDC_ISSUER_URL: https://issuer.example
      OIDC_CLIENT_ID: labops-test
      OIDC_CLIENT_SECRET: test-only-placeholder
      PUBLIC_BASE_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@11bd71110274da32b65f52d9bf5c149fd131c8c9 # v4.2.2
      - uses: pnpm/action-setup@8657f0005ce1fd292093509b79da4a8af9da6319 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@f07b6b5f37bb44db01d6c8a7725cf9a76520b3a1 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db run migrate
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
        env:
          PORT: 5000
          BASE_PATH: /

  # Security scanning runs on the PR to block regressions from entering main.
  # Trivy is the only tool that needs to run on every PR.
  # Dependency audit, gitleaks, and CodeQL run on schedule + push to main
  # to avoid slowing down every PR.
  trivy:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@11bd71110274da32b65f52d9bf5c149fd131c8c9 # v4.2.2
      - uses: aquasecurity/trivy-action@45dd14b4597377207c5d993e429db81b8e4f2c79 # v0.30.0
        with:
          scan-type: fs
          ignore-unpatched: true
          output: trivy-results.sarif
          format: sarif
      - uses: github/codeql-action@5abbd1a2bbd07d6388b8b55a4cf93450e3a52822 # v3.29.3
        if: always()
        with:
          upload-sarif: true
          sarif_file: trivy-results.sarif
  dependency-review:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71110274da32b65f52d9bf5c149fd131c8c9 # v4.2.2
      - uses: actions/dependency-review@2741a086180f4f634c2d749828f20383e2162860 # v4
        with:
          fail-on-severity: "critical"
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, PostgreSQL, Unicode-DFS-2016
