name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: labops_test
          POSTGRES_PASSWORD: labops_test
          POSTGRES_DB: labops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labops_test -d labops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://labops_test:labops_test@127.0.0.1:5432/labops_test
      NODE_ENV: test
      OIDC_ISSUER_URL: https://issuer.example
      OIDC_CLIENT_ID: labops-test
      OIDC_CLIENT_SECRET: test-only-placeholder
      PUBLIC_BASE_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db run migrate
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
        env:
          PORT: 5000
          BASE_PATH: /

  # Security scanning runs on the PR to block regressions from entering main.
  # Trivy is the only tool that needs to run on every PR.
  # Dependency review runs on PRs only — it requires a base/head ref that
  # only exists in pull_request (and pull_request_target) events.
  trivy:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          ignore-unpatched: true
          output: trivy-results.sarif
          format: sarif
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: trivy-results.sarif
  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@4901385134134e04cec5fbe5ddfe3b2c5bd5d976 # v4
        with:
          fail-on-severity: "critical"
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, PostgreSQL, Unicode-DFS-2016, MPL-2.0, BlueOak-1.0.0, Apache-2.0 AND MIT, ISC AND JSON AND MIT
