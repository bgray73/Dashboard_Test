name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: ["0 6 * * 1"] # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run dependency audit
        run: pnpm audit --prod --audit-level=high
        env:
          CI: true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        with:
          config-path: .gitleaks.toml
          fail: true
          verbose: true

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https gnupg lsb-release jq
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Run Trivy filesystem scan (vulnerabilities)
        id: trivy-vuln
        run: |
          trivy fs --format json --output trivy-vuln.json --severity CRITICAL,HIGH,MEDIUM,LOW .
          echo "vuln_count=$(jq '.Results[].Vulnerabilities | length' trivy-vuln.json 2>/dev/null | awk '{s+=$1} END {print s+0}')" >> $GITHUB_OUTPUT
      - name: Run Trivy filesystem scan (secrets)
        id: trivy-secret
        run: |
          trivy fs --format json --output trivy-secret.json --scanners secret .
          echo "secret_count=$(jq '.Results[].Secrets | length' trivy-secret.json 2>/dev/null | awk '{s+=$1} END {print s+0}')" >> $GITHUB_OUTPUT
      - name: Load baseline
        run: |
          if [ -f .trivy-baseline.json ]; then
            cp .trivy-baseline.json baseline.json
          else
            echo '{"Results":[]}' > baseline.json
          fi
      - name: Compare Trivy vulnerability results with baseline
        id: compare-vuln
        run: |
          NEW_VULN=$(jq -s '.[0] as $new | .[1] as $base | 
            $new.Results[]? | 
            .Vulnerabilities[]? | 
            select(.VulnerabilityID | . as $id | $base.Results[]?.Vulnerabilities[]? | select(.VulnerabilityID == $id) | not)
          ' trivy-vuln.json baseline.json 2>/dev/null | wc -l)
          echo "new_vuln_count=$NEW_VULN" >> $GITHUB_OUTPUT
          echo "New vulnerabilities found: $NEW_VULN"
      - name: Compare Trivy secret results with baseline
        id: compare-secret
        run: |
          NEW_SECRET=$(jq -s '.[0] as $new | .[1] as $base | 
            $new.Results[]? | 
            .Secrets[]? | 
            select(.RuleID | . as $id | $base.Results[]?.Secrets[]? | select(.RuleID == $id) | not)
          ' trivy-secret.json baseline.json 2>/dev/null | wc -l)
          echo "new_secret_count=$NEW_SECRET" >> $GITHUB_OUTPUT
          echo "New secrets found: $NEW_SECRET"
      - name: Check for new Critical/High vulnerabilities
        run: |
          NEW_CRITICAL_HIGH=$(jq -s '.[0] as $new | .[1] as $base | 
            $new.Results[]? | 
            .Vulnerabilities[]? | 
            select((.Severity == "CRITICAL" or .Severity == "HIGH")) | 
            select(.VulnerabilityID | . as $id | $base.Results[]?.Vulnerabilities[]? | select(.VulnerabilityID == $id) | not)
          ' trivy-vuln.json baseline.json 2>/dev/null | wc -l)
          if [ "$NEW_CRITICAL_HIGH" -gt 0 ]; then
            echo "Found $NEW_CRITICAL_HIGH new Critical or High vulnerabilities"
            exit 1
          fi
      - name: Check for new Medium/Low vulnerabilities exceeding threshold
        run: |
          BASELINE_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM" or .Severity == "LOW")] | length' baseline.json 2>/dev/null || echo 0)
          NEW_COUNT=$(jq -s '.[0] as $new | .[1] as $base | 
            $new.Results[]? | 
            .Vulnerabilities[]? | 
            select((.Severity == "MEDIUM" or .Severity == "LOW")) | 
            select(.VulnerabilityID | . as $id | $base.Results[]?.Vulnerabilities[]? | select(.VulnerabilityID == $id) | not)
          ' trivy-vuln.json baseline.json 2>/dev/null | wc -l)
          if [ "$BASELINE_COUNT" -eq 0 ]; then
            PERCENT_INCREASE=0
          else
            PERCENT_INCREASE=$(( (NEW_COUNT * 100) / BASELINE_COUNT ))
          fi
          echo "Baseline Medium/Low count: $BASELINE_COUNT"
          echo "New Medium/Low findings: $NEW_COUNT"
          echo "Percentage increase: $PERCENT_INCREASE%"
          if [ "$PERCENT_INCREASE" -gt 10 ]; then
            echo "New Medium/Low findings exceed 10% threshold"
            exit 1
          fi
      - name: Upload Trivy results as SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-vuln.json
          category: trivy-vuln
      - name: Upload Trivy secret results as SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-secret.json
          category: trivy-secret
      - name: Update baseline (only on schedule and if no new critical/high)
        if: github.event_name == 'schedule' && success()
        run: |
          cp trivy-vuln.json .trivy-baseline.json
          echo "Baseline updated from scheduled scan"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action@d6bbdef45e766d081b84a2def353b0055f728d3e # v3.29.3
        with:
          languages: javascript
      - name: Build CodeQL database
        uses: github/codeql-action@d6bbdef45e766d081b84a2def353b0055f728d3e # v3.29.3
        with:
          category: "languages"
      - name: Perform CodeQL analysis
        uses: github/codeql-action@d6bbdef45e766d081b84a2def353b0055f728d3e # v3.29.3
        with:
          category: "languages"